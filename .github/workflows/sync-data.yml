name: Sync data.json
on:
  repository_dispatch:
    types: [sync-data]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Write data.json
        run: |
          mkdir -p public
          echo "Received payload:"
          echo '${{ toJson(github.event.client_payload) }}'
          echo '${{ toJson(github.event.client_payload.ucs) }}' | python3 -c "
          import sys, json
          try:
              ucs = json.load(sys.stdin)
              print(f'Parsed {len(ucs)} UC items')
              with open('public/data.json', 'w') as f:
                  json.dump({'ucs': ucs}, f, indent=2)
              print('Successfully wrote data.json')
          except Exception as e:
              print(f'Error: {e}')
              sys.exit(1)
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data.json
          git commit -m "chore: sync data.json from app" || echo "No changes"
          git push
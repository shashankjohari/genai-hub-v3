name: Sync data.json
on:
  repository_dispatch:
    types: [sync-data]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Write data.json
        run: |
          mkdir -p public
          echo '${{ toJson(github.event.client_payload.ucs) }}' | python3 -c "
          import sys, json
          ucs = json.load(sys.stdin)
          with open('public/data.json', 'w') as f:
              json.dump({'ucs': ucs}, f, indent=2)
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data.json
          git commit -m "chore: sync data.json from app" || echo "No changes"
          git push
name: Sync data.json
on:
  repository_dispatch:
    types: [sync-data]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Debug payload
        run: |
          echo "Full event payload:"
          echo '${{ toJson(github.event) }}'
          echo ""
          echo "Client payload:"
          echo '${{ toJson(github.event.client_payload) }}'
          echo ""
          echo "UCS data:"
          echo '${{ toJson(github.event.client_payload.ucs) }}'
      - name: Write data.json
        run: |
          mkdir -p public
          echo "Processing payload..."
          PAYLOAD='${{ toJson(github.event.client_payload.ucs) }}'
          if [ -z "$PAYLOAD" ] || [ "$PAYLOAD" = "null" ]; then
            echo "Error: No UCS data in payload"
            exit 1
          fi
          echo "$PAYLOAD" | python3 -c "
          import sys, json
          try:
              ucs = json.load(sys.stdin)
              print(f'Parsed {len(ucs)} UC items successfully')
              data = {'ucs': ucs}
              with open('public/data.json', 'w') as f:
                  json.dump(data, f, indent=2)
              print('Successfully wrote data.json')
              print(f'File size: {len(json.dumps(data))} bytes')
          except Exception as e:
              print(f'Error parsing JSON: {e}')
              print('Raw input:', repr(sys.stdin.read()))
              sys.exit(1)
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync data.json from app"
            git push
            echo "Successfully committed and pushed data.json"
          fi
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/data.json
          git commit -m "chore: sync data.json from app" || echo "No changes"
          git push